# Perfil exclusivo para la demostración de la Sesión 9: muestra lo que
# ocurre sin el manejador global (@RestControllerAdvice desactivado con
# @Profile("!sin-manejador")). Además, expone la traza y el mensaje en el
# cuerpo del 500, para verlo desde el cliente. No debe usarse en
# producción: la traza es información de implementación y un riesgo de
# seguridad. Se combina con dev: --spring.profiles.active=dev,sin-manejador
server:
  error:
    include-message: always
    include-stacktrace: always
    include-binding-errors: always
